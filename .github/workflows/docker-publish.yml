name: Build and publish Docker images

on:
  push:
    branches: [v2]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'Docker Build'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jetmon
            dockerfile: docker/Dockerfile_jetmon
          - name: veriflier
            dockerfile: docker/Dockerfile_veriflier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: date
        run: echo "ymd=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Compute binary metadata
        id: binary-meta
        run: |
          {
            echo "version=$(git describe --tags --always --dirty)"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/automattic/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/v2' }}
            type=sha,format=short,prefix=${{ steps.date.outputs.ymd }}-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/v2' }}
            type=sha,format=short,prefix=pr-,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JETMON_BUILD_VERSION=${{ steps.binary-meta.outputs.version }}
            JETMON_BUILD_COMMIT=${{ steps.binary-meta.outputs.commit }}
            JETMON_BUILD_DATE=${{ steps.binary-meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  comment-pr:
    name: Post pull commands on PR
    needs: build-and-push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Upsert PR comment with docker pull commands
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const tag = `pr-${sha}`;
            const marker = '<!-- docker-publish:pr-images -->';
            const body = [
              marker,
              '### Docker images built for this PR',
              '',
              `Built from \`${sha}\`. Pull with:`,
              '',
              '```bash',
              `docker pull ghcr.io/automattic/jetmon:${tag}`,
              `docker pull ghcr.io/automattic/veriflier:${tag}`,
              '```',
              '',
              'Images are `linux/amd64` only. On Apple Silicon, add `--platform linux/amd64`. ' +
              'See [docs/operations-guide.md](https://github.com/Automattic/jetmon/blob/v2/docs/operations-guide.md) for run examples.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
