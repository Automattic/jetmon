# Database connection template inputs.
#
# Jetmon 2 reads database settings from config/config.json. It does not read
# these DB_* values directly at runtime. Use this file only as a reference for
# Docker/rollout tooling that renders config/config.json before the process
# starts, or translate these values into JSON manually.

DB_HOST=localhost
DB_PORT=3306
DB_USER=jetmon
DB_PASSWORD=change_me
DB_NAME=jetmon_db

# Production server-map mode. Leave unset for local/dev explicit DB_* use.
# When set, Jetmon reads the misc dataset from db-servers.php and hot-reloads
# read/write DB targets on DB_CONFIG_UPDATES_MIN.
# DB_SERVER_MAP_PATH=/jetmon/config-source/db-servers.php
# DB_SERVER_MAP_DATASET=misc
# DB_SERVER_MAP_DATACENTER=dfw
# DB_SERVER_MAP_ADDRESS=internet
