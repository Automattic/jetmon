services:
  veriflier:
    image: ${VERIFLIER_IMAGE:-ghcr.io/automattic/veriflier:latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${VERIFLIER_BIND_ADDR:-127.0.0.1}:${VERIFLIER_HOST_PORT:-7803}:7803"
    environment:
      VERIFLIER_AUTH_TOKEN: ${VERIFLIER_AUTH_TOKEN:?set VERIFLIER_AUTH_TOKEN}
      VERIFLIER_PORT: "7803"
      VERIFLIER_VANTAGE_ID: ${VERIFLIER_VANTAGE_ID:?set VERIFLIER_VANTAGE_ID}
      VERIFLIER_REGION: ${VERIFLIER_REGION:?set VERIFLIER_REGION}
      VERIFLIER_PROVIDER: ${VERIFLIER_PROVIDER:-vps}
      VERIFLIER_ENABLE_LEGACY_HTTP: ${VERIFLIER_ENABLE_LEGACY_HTTP:-false}
      VERIFLIER_TLS_CERT_PATH: ${VERIFLIER_TLS_CERT_PATH:-}
      VERIFLIER_TLS_KEY_PATH: ${VERIFLIER_TLS_KEY_PATH:-}
      CHECK_TARGET_SAFETY_MODE: ${CHECK_TARGET_SAFETY_MODE:-public_only}
      STATSD_ADDR: statsd:8125
      JETMON_HOSTNAME: ${JETMON_HOSTNAME:-}
      VERIFLIER_STATSD_HOST_PATH: ${VERIFLIER_STATSD_HOST_PATH:-}
      STATSD_HOST_PATH: ${STATSD_HOST_PATH:-}
      OPS_ALERTS_ENABLED: ${OPS_ALERTS_ENABLED:-false}
      OPS_ALERTS_SLACK_WEBHOOK_URL: ${OPS_ALERTS_SLACK_WEBHOOK_URL:-}
      OPS_ALERTS_MIN_SEVERITY: ${OPS_ALERTS_MIN_SEVERITY:-warning}
      OPS_ALERTS_REPEAT_INTERVAL_SEC: ${OPS_ALERTS_REPEAT_INTERVAL_SEC:-300}
      OPS_ALERTS_SERVICE_ONLINE: ${OPS_ALERTS_SERVICE_ONLINE:-true}
    depends_on:
      statsd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$VERIFLIER_TLS_CERT_PATH\" ]; then curl -k -fsS https://127.0.0.1:7803/v2/status; else curl -fsS http://127.0.0.1:7803/v2/status; fi"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - veriflier-config:/opt/veriflier/config

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    init: true
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_BIND_ADDR:-0.0.0.0}:${CADDY_HTTP_HOST_PORT:-80}:80"
      - "${CADDY_HTTPS_BIND_ADDR:-0.0.0.0}:${CADDY_HTTPS_HOST_PORT:-443}:443"
    environment:
      VERIFLIER_PUBLIC_HOST: ${VERIFLIER_PUBLIC_HOST:?set VERIFLIER_PUBLIC_HOST}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set CADDY_ACME_EMAIL}
      CADDY_ACME_CA: ${CADDY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./caddy/Caddyfile.veriflier-prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      veriflier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  statsd:
    image: ${STATSD_GRAPHITE_IMAGE:-graphiteapp/graphite-statsd}
    restart: unless-stopped
    ports:
      - "${GRAPHITE_BIND_ADDR:-127.0.0.1}:${GRAPHITE_HOST_PORT:-8088}:80"
    volumes:
      - statsd-graphite-storage:/opt/graphite/storage
      - statsd-logs:/var/log
      - ./graphite-storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  metrics-smoke:
    image: ${STATSD_GRAPHITE_IMAGE:-graphiteapp/graphite-statsd}
    profiles: ["smoke"]
    depends_on:
      statsd:
        condition: service_healthy
    environment:
      METRICS_SMOKE_METRIC: ${METRICS_SMOKE_METRIC:-com.jetpack.jetmon.compose.metrics_smoke}
      STATSD_SMOKE_UDP_HOST: statsd
      STATSD_SMOKE_UDP_PORT: "8125"
      GRAPHITE_SMOKE_URL: http://statsd
    volumes:
      - ./veriflier-metrics-smoke.py:/usr/local/bin/veriflier-metrics-smoke.py:ro
    entrypoint: ["python3"]
    command: ["/usr/local/bin/veriflier-metrics-smoke.py"]
    restart: "no"

volumes:
  veriflier-config:
  statsd-graphite-storage:
  statsd-logs:
  caddy-data:
  caddy-config:
