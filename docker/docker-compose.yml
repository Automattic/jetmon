services:
  mysqldb:
    image: ${JETMON_DB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jetmon_db}
      MYSQL_USER: ${MYSQL_USER:-jetmon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jetmon_dev_password}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-jetmon_db}
      MARIADB_USER: ${MYSQL_USER:-jetmon}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-jetmon_dev_password}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "if command -v healthcheck.sh >/dev/null 2>&1; then healthcheck.sh --connect --innodb_initialized; else MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent; fi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql-user:
    image: ${JETMON_DB_IMAGE:-mariadb:11.4}
    restart: "no"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jetmon_db}
      MYSQL_USER: ${MYSQL_USER:-jetmon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jetmon_dev_password}
    volumes:
      - ./init-mysql-user.sh:/usr/local/bin/init-mysql-user.sh:ro
    entrypoint: ["bash", "/usr/local/bin/init-mysql-user.sh"]

  jetmon:
    hostname: docker.jetmon.dev.com
    build:
      context: ../
      dockerfile: docker/Dockerfile_jetmon
      args:
        JETMON_BUILD_VERSION: ${JETMON_BUILD_VERSION:-dev}
        JETMON_BUILD_COMMIT: ${JETMON_BUILD_COMMIT:-unknown}
        JETMON_BUILD_DATE: ${JETMON_BUILD_DATE:-unknown}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../config:/jetmon/config
      - ../stats:/jetmon/stats
    environment:
      DB_HOST: mysqldb
      DB_USER: ${MYSQL_USER:-jetmon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-jetmon_dev_password}
      DB_NAME: ${MYSQL_DATABASE:-jetmon_db}
      DB_PORT: "3306"
      CONFIG_PROFILE: ${CONFIG_PROFILE:-dev}
      JETMON_CONFIG_RENDER_MODE: ${JETMON_CONFIG_RENDER_MODE:-always}
      SCHEMA_MANAGEMENT_MODE: ${SCHEMA_MANAGEMENT_MODE:-}
      VERIFLIER_HOST: ${VERIFLIER_HOST:-veriflier}
      VERIFLIER_AUTH_TOKEN: ${VERIFLIER_AUTH_TOKEN:-veriflier_1_auth_token}
      VERIFLIER_PORT: "7803"
      VERIFLIER_TRANSPORT_SCHEME: ${VERIFLIER_TRANSPORT_SCHEME:-}
      WPCOM_AUTH_TOKEN: ${WPCOM_AUTH_TOKEN:-change_me}
      WPCOM_NOTIFY_ENABLE: ${WPCOM_NOTIFY_ENABLE:-}
      WPCOM_NOTIFY_MODE: ${WPCOM_NOTIFY_MODE:-legacy}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-jetmon@noreply.invalid}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      STATSD_ADDR: ${STATSD_ADDR-statsd:8125}
      JETMON_HOSTNAME: ${JETMON_HOSTNAME:-}
      STATSD_HOST_PATH: ${STATSD_HOST_PATH:-}
      CHECK_TARGET_SAFETY_MODE: ${CHECK_TARGET_SAFETY_MODE:-public_only}
      DEFAULT_CHECK_METHOD: ${DEFAULT_CHECK_METHOD:-}
      DEFAULT_DETECTION_PROFILE: ${DEFAULT_DETECTION_PROFILE:-}
      ROLLOUT_MODE: ${ROLLOUT_MODE:-}
      VERIFLIER_DISCOVERY_MODE: ${VERIFLIER_DISCOVERY_MODE:-}
      DELIVERY_OWNER_HOST: ${DELIVERY_OWNER_HOST:-}
      API_TLS_CERT_PATH: ${API_TLS_CERT_PATH:-}
      API_TLS_KEY_PATH: ${API_TLS_KEY_PATH:-}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      DEBUG_PORT: ${DEBUG_PORT:-6060}
      JETMON_PID_FILE: /jetmon/stats/jetmon2.pid
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_HOST_PORT:-8080}:8080"
      - "${API_BIND_ADDR:-127.0.0.1}:${API_HOST_PORT:-8090}:8090"
    depends_on:
      mysql-user:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      statsd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$API_TLS_CERT_PATH\" ]; then curl -k -fsS https://127.0.0.1:8090/api/v1/health; else curl -fsS http://127.0.0.1:8090/api/v1/health; fi"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  veriflier:
    build:
      context: ../
      dockerfile: docker/Dockerfile_veriflier
      args:
        JETMON_BUILD_VERSION: ${JETMON_BUILD_VERSION:-dev}
        JETMON_BUILD_COMMIT: ${JETMON_BUILD_COMMIT:-unknown}
        JETMON_BUILD_DATE: ${JETMON_BUILD_DATE:-unknown}
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ../veriflier2/config:/opt/veriflier/config
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VERIFLIER_HOST_PORT:-7803}:7803"
    environment:
      VERIFLIER_AUTH_TOKEN: ${VERIFLIER_AUTH_TOKEN:-veriflier_1_auth_token}
      VERIFLIER_PORT: "7803"
      VERIFLIER_CONFIG: ${VERIFLIER_CONFIG:-/tmp/veriflier-rendered-config/veriflier.json}
      VERIFLIER_VANTAGE_ID: ${VERIFLIER_VANTAGE_ID:-local-veriflier}
      VERIFLIER_REGION: ${VERIFLIER_REGION:-local}
      VERIFLIER_PROVIDER: ${VERIFLIER_PROVIDER:-docker}
      VERIFLIER_ENABLE_LEGACY_HTTP: ${VERIFLIER_ENABLE_LEGACY_HTTP:-false}
      VERIFLIER_CONFIG_RENDER_MODE: ${VERIFLIER_CONFIG_RENDER_MODE:-always}
      VERIFLIER_TLS_CERT_PATH: ${VERIFLIER_TLS_CERT_PATH:-}
      VERIFLIER_TLS_KEY_PATH: ${VERIFLIER_TLS_KEY_PATH:-}
      CHECK_TARGET_SAFETY_MODE: ${CHECK_TARGET_SAFETY_MODE:-public_only}
      STATSD_ADDR: ${STATSD_ADDR-statsd:8125}
      JETMON_HOSTNAME: ${JETMON_HOSTNAME:-}
      VERIFLIER_STATSD_HOST_PATH: ${VERIFLIER_STATSD_HOST_PATH:-}
      STATSD_HOST_PATH: ${STATSD_HOST_PATH:-}
    depends_on:
      statsd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$VERIFLIER_TLS_CERT_PATH\" ]; then curl -k -fsS https://127.0.0.1:7803/v2/status; else curl -fsS http://127.0.0.1:7803/v2/status; fi"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-fixture:
    build:
      context: ../
      dockerfile: docker/Dockerfile_api_fixture
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_FIXTURE_HTTP_HOST_PORT:-18091}:8091"
      - "${BIND_ADDR:-127.0.0.1}:${API_FIXTURE_HTTPS_HOST_PORT:-18443}:8443"
    healthcheck:
      test: ["CMD", "/jetmon-testsite", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAILPIT_HOST_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  statsd:
    image: graphiteapp/graphite-statsd
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAPHITE_HOST_PORT:-8088}:80"
      - "${BIND_ADDR:-127.0.0.1}:${STATSD_HOST_PORT:-8125}:8125"
      - "${BIND_ADDR:-127.0.0.1}:${STATSD_HOST_PORT:-8125}:8125/udp"
    volumes:
      - statsd-graphite-storage:/opt/graphite/storage
      - ./graphite-storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf:ro
      - statsd-logs:/var/log
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  metrics-smoke:
    image: graphiteapp/graphite-statsd
    profiles: ["smoke"]
    depends_on:
      statsd:
        condition: service_healthy
    environment:
      METRICS_SMOKE_METRIC: ${METRICS_SMOKE_METRIC:-com.jetpack.jetmon.compose.metrics_smoke}
      STATSD_SMOKE_UDP_HOST: statsd
      STATSD_SMOKE_UDP_PORT: "8125"
      GRAPHITE_SMOKE_URL: http://statsd
    volumes:
      - ./veriflier-metrics-smoke.py:/usr/local/bin/veriflier-metrics-smoke.py:ro
    entrypoint: ["python3"]
    command: ["/usr/local/bin/veriflier-metrics-smoke.py"]
    restart: "no"

volumes:
  db:
  mailpit-data:
  statsd-graphite-storage:
  statsd-logs:
