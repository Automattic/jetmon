[carbon]
pattern = ^carbon\.
retentions = 60s:90d

[jetmon]
pattern = ^(com\.jetpack\.jetmon\.|stats_counts\.com\.jetpack\.jetmon\.|stats\.gauges\.com\.jetpack\.jetmon\.|stats\.timers\.com\.jetpack\.jetmon\.)
retentions = 10s:6h, 1m:7d, 10m:5y

[default]
pattern = .*
retentions = 10s:6h, 1m:7d, 10m:5y
